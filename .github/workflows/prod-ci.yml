name: prod-ci

# Mirrors the nocode-saas and whatsapp-bridge pipelines. Three differences, all forced by what
# this service is.
#
# 1. **Not blue-green.** Every Java service here overlaps old and new for a moment. This one owns
#    a write-ahead log and a local Parquet tier on disk, and two processes over one data
#    directory corrupt both — the same reason whatsapp-bridge is a singleton, and the same
#    category keepup.sh already uses for config, eureka and gateway. The gap is a second or two
#    of refused ingest, which the beacon retries; the alternative is a data directory two
#    processes disagree about.
#
# 2. **It runs on the analytics VM, not the app VM.** It is stateful and the app VMs are
#    redeployed constantly; the analytics box already exists, has the disk, and is where the
#    Cloudflare worker already points (`ENGINE_ORIGIN = https://engine.modlix.com`).
#
# 3. **`go test` gates the image.** Two of the things this service decides — what counts as a
#    page view, and which page a click belongs to — fail silently when they regress: the
#    numbers still arrive, they are just wrong. The suite includes the beacon's own tests,
#    which run under node; ubuntu-latest has one, so they are not skipped here.
on:
  push:
    branches:
      - oci-production
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/prod-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      OCIR_HOST: ocir.us-ashburn-1.oci.oraclecloud.com
      # `idfmutpuhiky` is the TENANCY's object-storage namespace, not a compartment — one
      # tenancy, one namespace, so it is identical for dev, stage and prod. The compartment
      # is what separates them, and the repository itself lives in `prod` alongside every
      # other prod-* image. So a shared namespace in the path is not a sign that prod and
      # non-prod share anything that matters; the credential below is prod's own.
      OCIR_REPO: ocir.us-ashburn-1.oci.oraclecloud.com/idfmutpuhiky/prod-analytics-engine

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - run: go vet ./...
      # -race here and not on the deploy path: the ingest and query sides share the WAL and the
      # store index across goroutines, and a data race there shows up as a wrong number rather
      # than a crash.
      - run: go test -race ./...

      # A plain `docker login` to OCIR. "CLI_AUTH_TOKEN" is a misnomer inherited from the other
      # pipelines: it has nothing to do with the OCI CLI, it is this login's password.
      #
      # Prod uses its OWN credential, unlike nocode-saas, where every prod pipeline pushes with
      # the non-prod token. An auth token is scoped to a user rather than a compartment, so the
      # shared one CAN push here — it simply means one leaked credential reaches production
      # images as well as dev ones. This repo is new, so it starts with them separated.
      #
      # Both halves are prod's own secrets even though the user behind them is currently the same
      # `idfmutpuhiky/admin@modlix.com` that non-prod uses — that account holds access to both
      # compartments. Spelling the pair out here rather than borrowing the non-prod username means
      # moving prod onto its own OCI user later is two secret values and no edit to this file.
      - run: |
          echo "${{ secrets.OCI_PROD_CLI_AUTH_TOKEN }}" | docker login $OCIR_HOST \
            -u "${{ secrets.OCI_PROD_DOCKER_USER_NAME }}" \
            --password-stdin

      # --platform is explicit because the Dockerfile does not pin GOARCH: it builds for whatever
      # the builder is, which silently produces an unrunnable image the day a runner or a host
      # moves to Ampere.
      - run: |
          docker build --platform linux/amd64 \
                       --build-arg VERSION=${{ github.sha }} \
                       -t $OCIR_REPO:${{ github.sha }} \
                       -t $OCIR_REPO:latest \
                       -f Dockerfile .
          docker push $OCIR_REPO:${{ github.sha }}
          docker push $OCIR_REPO:latest

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      # The immutable tag, not :latest. keepup.sh writes it into the compose env file and brings
      # the container up on exactly that digest, so what is running is answerable from the
      # commit — and a re-run of an older workflow rolls back rather than redeploying whatever
      # :latest happens to be.
      # The host by its VCN DNS name, not an IP in a secret.
      #
      # The runner is self-hosted and IS the jumphost, inside this VCN at 172.16.0.107 — the
      # same 172.16.0.0/24 subnet all three analytics VMs sit in, prod included, because a
      # compartment is an IAM boundary and not a network one. So the VCN resolver answers for
      # these names and the address never has to be written down.
      #
      # The other pipelines pass an IP through a secret. That is habit rather than secrecy: an
      # RFC1918 address inside a private VCN protects nothing by being hidden, it is already in
      # oci-config and readable from the CLI, and a secret goes stale silently the day an
      # instance is replaced. A name that the resolver owns fails loudly instead.
      #
      # **prod-external.key, not prod-internal.key.** Every other pipeline in the platform uses
      # the internal pair, because the app VMs were provisioned with it. These analytics boxes
      # came up separately in the PostHog days and carry the external pair instead. Copying the
      # line from a nocode-saas workflow gets you a permission denial on the first deploy.
      # `set -o pipefail` is load-bearing, and it belongs INSIDE the quoted command because that
      # is where the pipeline is -- the `| tee` runs on the analytics host, not on the runner.
      # A pipeline's exit status is its LAST command's, so without this keepup.sh can fail to
      # pull, leave nothing running, and the job still reports green. That happened on the first
      # real deploy: the workflow said success while no container existed.
      - run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -i /home/ubuntu/keys/prod-external.key \
              opc@prod-analytics.sub10150624020.modlixvcn.oraclevcn.com \
            "set -o pipefail; bash /home/opc/scripts/keepup.sh deploy analytics-engine \
               ocir.us-ashburn-1.oci.oraclecloud.com/idfmutpuhiky/prod-analytics-engine:${{ needs.build.outputs.image_tag }} \
               2>&1 | tee -a /var/log/keepup.log"
